<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="sample.php" method="POST" enctype="multipart/form-data">
        <label for="username">username</label>
        <input type="text" placeholder="Hello123..." id="username" minlength="8" maxlength="20" required>
        <br><label for="password">password</label>
        <input type="password" id="password" placeholder="************" required>
        <br>
        <label for="email">email</label>
        <input type="email" id="email" required placeholder="abc@xyz.com">
        <br>
        <label for="phone">phone</label>
        <input type="tel" id="phone" pattern="[+]{1}[0-9]{2}-[0-9]{10}" required><br>
        <label for="date">birthdate</label>
        <input type="date" id="date"><br>
        <label for="quantity">quantity</label>
        <input type="number" id="quantity" min="0" max="99" value="1"><br>
        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr." value="Mr." name="title"><br>
        <label for="Ms.">Ms.</label>
        <input type="radio" id="Ms." value="Ms." name="title"><br>
        <label for="Dr.">Dr.</label>
        <input type="radio" id="Dr." value="Dr." name="title"><br>
        <label for="payment">payment</label>
        <select id="payment">
            <option value="visa">visa</option>
            <option value="mastercard">mastercard</option>
            <option value="rupay">rupay</option>
        </select><br>

        <label for="checkbox">Subscribe:</label>
        <input type="checkbox" id="subscribe"><br>

        <label for="comment">comment</lable>
        <textarea id="comment" rows="3" columns="25"></textarea>
        <br>
        <label for="file">file:</label>
        <input type="file" id="file" accept="image/png,image/jpg"><br>
        <input type="submit">
        <input type="reset">
    </form>
</body>
</html>
